name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      linux_x64:
        description: Linux x64 AppImage
        type: boolean
        default: true
      linux_arm64:
        description: Linux ARM64 AppImage
        type: boolean
        default: true
      windows_x64:
        description: Windows x64 ZIP
        type: boolean
        default: true
      macos_arm64:
        description: macOS ARM64 app ZIP
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux-x64:
    if: inputs.linux_x64
    uses: ./.github/workflows/package-linux.yml
    with:
      architecture: x64

  linux-arm64:
    if: inputs.linux_arm64
    uses: ./.github/workflows/package-linux.yml
    with:
      architecture: arm64

  windows:
    if: inputs.windows_x64
    name: Windows x64 ZIP
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
      - name: Configure and build
        env:
          CFLAGS: /Zi
          CXXFLAGS: /Zi
          LDFLAGS: /DEBUG:FULL /OPT:REF /OPT:ICF
        run: |
          cmake -S source -B build -A x64 -DLOVE_DEPENDENCIES=BUNDLED "-DCMAKE_PDB_OUTPUT_DIRECTORY=$PWD/pdb" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" 2>&1 | Tee-Object "$env:RUNNER_TEMP/configure.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object "$env:RUNNER_TEMP/build.log"
          exit $LASTEXITCODE
      - name: Package ZIP and debug symbols
        run: |
          New-Item -ItemType Directory -Force dist, symbols | Out-Null
          cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist -D CPACK_PACKAGE_FILE_NAME=love-windows-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem pdb -Recurse -Filter *.pdb | Copy-Item -Destination symbols
          Copy-Item build/dependencies/luajit/lua51.pdb symbols
          Compress-Archive symbols/*.pdb dist/love-windows-x64-debug.zip
          python source/extra/packaging/manifest.py dist/manifest.json --source source --target windows-x64 --sources source/.deps/windows/sources.json
          exit $LASTEXITCODE
      - name: Prepare packaged executable for tests
        run: |
          Expand-Archive dist/love-windows-x64.zip unpacked
          $console = @(Get-ChildItem unpacked -Recurse -Filter lovec.exe)
          if ($console.Count -ne 1) { throw 'Expected one packaged lovec.exe' }
          "LOVE_TEST_EXE=$($console[0].FullName)" >> $env:GITHUB_ENV
          curl.exe --fail --location --retry 3 https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z --output mesa.7z
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') { throw 'Mesa checksum mismatch' }
          7z x mesa.7z -omesa
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Scope the software driver to the extracted test copy; it is not shipped.
          Copy-Item mesa/x64/*.dll $console[0].DirectoryName
      - name: Test packaged executable (OpenGL)
        timeout-minutes: 5
        env:
          ALSOFT_CONF: ${{ github.workspace }}/source/testing/resources/alsoft.conf
          LOVE_GRAPHICS_DEBUG: '1'
          GALLIUM_DRIVER: llvmpipe
          LP_PERF: no_rast_linear
        run: |
          & $env:LOVE_TEST_EXE source/testing --all --isRunner --renderers opengl 2>&1 | Tee-Object "$env:RUNNER_TEMP/opengl.log"
          exit $LASTEXITCODE
      - name: Test packaged executable (OpenGL ES)
        timeout-minutes: 5
        env:
          ALSOFT_CONF: ${{ github.workspace }}/source/testing/resources/alsoft.conf
          LOVE_GRAPHICS_DEBUG: '1'
          LOVE_GRAPHICS_USE_OPENGLES: '1'
          GALLIUM_DRIVER: llvmpipe
          LP_PERF: no_rast_linear
        run: |
          & $env:LOVE_TEST_EXE source/testing --all --isRunner --renderers opengl 2>&1 | Tee-Object "$env:RUNNER_TEMP/opengles.log"
          exit $LASTEXITCODE
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: love-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-failure
          path: |
            source/testing/output/
            ${{ runner.temp }}/configure.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/opengl.log
            ${{ runner.temp }}/opengles.log
          retention-days: 7

  macos:
    if: inputs.macos_arm64
    name: macOS ARM64 app ZIP
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
      - name: Build ARM64 app from source
        run: |
          cmake -S source -B build -DLOVE_DEPENDENCIES=BUNDLED -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 2>&1 | tee "$RUNNER_TEMP/configure.log"
          cmake --build build --target love --parallel 3 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Package app and debug symbols
        run: |
          python3 source/extra/packaging/macos.py --build build --output dist
          mkdir unpacked
          ditto -x -k dist/love-macos-arm64.zip unpacked
          test "$(lipo -archs unpacked/love.app/Contents/MacOS/love)" = arm64
          python3 source/extra/packaging/manifest.py dist/manifest.json --source source --target macos-arm64 --sources source/.deps/macos/sources.json
      - name: Test packaged app (OpenGL)
        timeout-minutes: 5
        env:
          ALSOFT_CONF: ${{ github.workspace }}/source/testing/resources/alsoft.conf
          LOVE_GRAPHICS_DEBUG: '1'
        run: unpacked/love.app/Contents/MacOS/love source/testing --all --isRunner --renderers opengl 2>&1 | tee "$RUNNER_TEMP/opengl.log"
      - name: Test packaged app (Metal)
        timeout-minutes: 5
        env:
          ALSOFT_CONF: ${{ github.workspace }}/source/testing/resources/alsoft.conf
          LOVE_GRAPHICS_DEBUG: '1'
        run: unpacked/love.app/Contents/MacOS/love source/testing --all --isRunner --renderers metal 2>&1 | tee "$RUNNER_TEMP/metal.log"
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: love-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-failure
          path: |
            source/testing/output/
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/opengl.log
            ${{ runner.temp }}/metal.log
          retention-days: 7
